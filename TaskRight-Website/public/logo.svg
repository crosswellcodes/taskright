<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Blue rounded square background -->
  <rect width="200" height="200" rx="40" fill="#2563eb"/>

  <!-- Subtle inner highlight -->
  <rect x="0" y="0" width="200" height="100" rx="40" fill="white" opacity="0.06"/>

  <!-- TR lettermark -->
  <text
    x="100"
    y="128"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Georgia, sans-serif"
    font-size="84"
    font-weight="800"
    fill="white"
    text-anchor="middle"
    letter-spacing="-3"
  >TR</text>
</svg>
